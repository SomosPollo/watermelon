name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional version to validate without publishing (for example v0.5.0)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Install Lima and QEMU for short E2E tests
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test CLI E2E workflow without a VM
        run: go test -tags=e2e -short -count=1 ./test/...

  macos-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test macOS paths
        run: go test -count=1 ./...

      - name: Vet macOS paths
        run: go vet ./...

  cross-build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Select build version and prepare candidate notes
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            echo 'version=v0.0.0-snapshot' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'release_version must be a stable vMAJOR.MINOR.PATCH version' >&2
            exit 1
          fi
          sh ./test/release_notes.sh "$RELEASE_VERSION" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if git rev-parse --verify "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$RELEASE_VERSION^{commit}")" = "$(git rev-parse HEAD)"
          else
            # Runner-local only: never push this tag or create a GitHub release.
            git tag -- "$RELEASE_VERSION"
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build a GoReleaser snapshot
        if: inputs.release_version == ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

      - name: Build exact candidate artifacts without publishing
        if: inputs.release_version != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish --release-notes=${{ runner.temp }}/release-notes.md

      - name: Stage and verify artifacts
        run: |
          ./test/stage_release_assets.sh dist release-dist
          (cd release-dist && sha256sum --check checksums.txt)

      - name: Validate candidate build metadata
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: sh ./test/release_buildinfo.sh release-dist "$RELEASE_VERSION"

      - name: Pack artifacts
        run: tar -czf release-assets.tar.gz -C release-dist .

      - name: Upload artifacts for native installer gates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets.tar.gz
          if-no-files-found: error
          retention-days: 7

  installer-smoke:
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Smoke test native artifacts and installer
        env:
          EXPECTED_VERSION: ${{ needs.cross-build.outputs.version }}
        run: |
          mkdir dist
          tar -xzf release-assets.tar.gz -C dist
          ./test/install_smoke.sh dist "$EXPECTED_VERSION"

  real-vm-lifecycle:
    name: Live VM (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: lifecycle
            tests: '^TestE2ERealVMLifecycle$'
          - suite: projects-node
            tests: '^TestE2EManagedWorkspaceProjects$/^node$'
          - suite: projects-python
            tests: '^TestE2EManagedWorkspaceProjects$/^python$'
          - suite: projects-go
            tests: '^TestE2EManagedWorkspaceProjects$/^go$'
          - suite: projects-rust
            tests: '^TestE2EManagedWorkspaceProjects$/^rust$'
          - suite: multi-language
            tests: '^TestE2EManagedWorkspaceMultiLanguage$'
          - suite: logs
            tests: '^TestE2EManagedWorkspaceLogs$'
          - suite: extended
            tests: '^TestE2EExtendedLanguages$'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima and QEMU
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          test -e /dev/kvm
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-watermelon-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Free space for extended SDK fixtures
        if: matrix.suite == 'extended'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Test live VM security boundary
        env:
          WATERMELON_E2E_REQUIRE_REAL_VM: "1"
          WATERMELON_E2E_PATTERN: ${{ matrix.tests }}
          WATERMELON_E2E_COUNT: ${{ inputs.release_version != '' && (matrix.suite == 'projects-node' || matrix.suite == 'projects-go') && '2' || '1' }}
        run: go test -tags=e2e -run "${WATERMELON_E2E_PATTERN}" -timeout=65m -count="${WATERMELON_E2E_COUNT}" -v ./test/...

  real-vm-ask:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima and QEMU
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          test -e /dev/kvm
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-watermelon-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test live ask-mode security boundary
        env:
          WATERMELON_E2E_REQUIRE_REAL_VM: "1"
        run: go test -tags=e2e -run '^TestE2ENamedNoMountAskToolWorkflow$' -timeout=35m -count=1 -v ./test/...

  lima-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 2.0.0
            sha256: e20350addf8b2bfe96baf7fc1619ce69b0f5bfeafc1dac0a651daf3c1092c297
          - version: 2.2.0
            sha256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima ${{ matrix.version }}
        env:
          LIMA_VERSION: ${{ matrix.version }}
          LIMA_SHA256: ${{ matrix.sha256 }}
        run: |
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test Lima compatibility contract
        env:
          WATERMELON_TEST_REAL_LIMA: "1"
          WATERMELON_EXPECT_LIMA_VERSION: ${{ matrix.version }}
        run: go test -count=1 ./internal/lima

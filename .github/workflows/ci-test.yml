name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Install Lima and QEMU for short E2E tests
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test CLI E2E workflow without a VM
        run: go test -tags=e2e -short -count=1 ./test/...

  macos-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test macOS paths
        run: go test -count=1 ./...

      - name: Vet macOS paths
        run: go vet ./...

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build a GoReleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

      - name: Validate snapshot artifacts and installer
        run: |
          ./test/stage_release_assets.sh dist release-dist
          (cd release-dist && sha256sum --check checksums.txt)
          ./test/install_smoke.sh release-dist v0.0.0-snapshot

  real-vm-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima and QEMU
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          test -e /dev/kvm
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-watermelon-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test live VM security boundary
        env:
          WATERMELON_E2E_REQUIRE_REAL_VM: "1"
        run: go test -tags=e2e -run '^TestE2ERealVMLifecycle$' -timeout=50m -count=1 -v ./test/...

  real-vm-ask:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima and QEMU
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          test -e /dev/kvm
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-watermelon-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test live ask-mode security boundary
        env:
          WATERMELON_E2E_REQUIRE_REAL_VM: "1"
        run: go test -tags=e2e -run '^TestE2ENamedNoMountAskToolWorkflow$' -timeout=35m -count=1 -v ./test/...

  lima-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 2.0.0
            sha256: e20350addf8b2bfe96baf7fc1619ce69b0f5bfeafc1dac0a651daf3c1092c297
          - version: 2.2.0
            sha256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima ${{ matrix.version }}
        env:
          LIMA_VERSION: ${{ matrix.version }}
          LIMA_SHA256: ${{ matrix.sha256 }}
        run: |
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test Lima compatibility contract
        env:
          WATERMELON_TEST_REAL_LIMA_INFO: "1"
          WATERMELON_EXPECT_LIMA_VERSION: ${{ matrix.version }}
        run: go test -count=1 ./internal/lima

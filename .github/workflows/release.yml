name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Install Lima and QEMU for short E2E tests
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test CLI E2E workflow without a VM
        run: go test -tags=e2e -short -count=1 ./test/...

  real-vm-security:
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestE2ENamedNoMountAskToolWorkflow
          - TestE2ERealVMLifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima and QEMU
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          test -e /dev/kvm
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-watermelon-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test live VM security boundary
        env:
          WATERMELON_E2E_REQUIRE_REAL_VM: "1"
          WATERMELON_E2E_TEST: ${{ matrix.test }}
        run: go test -tags=e2e -run "^${WATERMELON_E2E_TEST}$" -timeout=50m -count=1 -v ./test/...

  lima-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 2.0.0
            sha256: e20350addf8b2bfe96baf7fc1619ce69b0f5bfeafc1dac0a651daf3c1092c297
          - version: 2.2.0
            sha256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima ${{ matrix.version }}
        env:
          LIMA_VERSION: ${{ matrix.version }}
          LIMA_SHA256: ${{ matrix.sha256 }}
        run: |
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test Lima compatibility contract
        env:
          WATERMELON_TEST_REAL_LIMA_INFO: "1"
          WATERMELON_EXPECT_LIMA_VERSION: ${{ matrix.version }}
        run: go test -count=1 ./internal/lima

  build:
    needs:
      - test
      - real-vm-security
      - lima-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare release directory
        run: mkdir dist

      - name: Prepare release notes
        run: sh ./test/release_notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md > dist/release-notes.md

      - name: Build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/watermelon-darwin-arm64 ./cmd/watermelon

      - name: Build darwin/amd64
        env:
          GOOS: darwin
          GOARCH: amd64
        run: go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/watermelon-darwin-amd64 ./cmd/watermelon

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/watermelon-linux-arm64 ./cmd/watermelon

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/watermelon-linux-amd64 ./cmd/watermelon

      - name: Build nfqd linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/watermelon-nfqd-linux-arm64 ./cmd/watermelon-nfqd

      - name: Build nfqd linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags "-X main.Version=${GITHUB_REF_NAME}" -o dist/watermelon-nfqd-linux-amd64 ./cmd/watermelon-nfqd

      - name: Validate release build metadata
        run: sh ./test/release_buildinfo.sh dist "${GITHUB_REF_NAME}"

      - name: Pack release artifacts
        run: tar -czf release-assets.tar.gz -C dist .

      - name: Stage release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  installer-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Smoke test release artifacts and installer
        run: |
          mkdir dist
          tar -xzf release-assets.tar.gz -C dist
          ./test/install_smoke.sh dist "${GITHUB_REF_NAME}"

  publish:
    needs: installer-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Unpack release artifacts
        run: |
          mkdir dist
          tar -xzf release-assets.tar.gz -C dist

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: dist/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/watermelon-darwin-arm64
            dist/watermelon-darwin-amd64
            dist/watermelon-linux-arm64
            dist/watermelon-linux-amd64
            dist/watermelon-nfqd-linux-arm64
            dist/watermelon-nfqd-linux-amd64

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Install Lima and QEMU for short E2E tests
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test CLI E2E workflow without a VM
        run: go test -tags=e2e -short -count=1 ./test/...

  real-vm-security:
    strategy:
      fail-fast: false
      matrix:
        test:
          - TestE2ENamedNoMountAskToolWorkflow
          - TestE2ERealVMLifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima and QEMU
        env:
          LIMA_VERSION: 2.2.0
          LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          test -e /dev/kvm
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-watermelon-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test live VM security boundary
        env:
          WATERMELON_E2E_REQUIRE_REAL_VM: "1"
          WATERMELON_E2E_TEST: ${{ matrix.test }}
        run: go test -tags=e2e -run "^${WATERMELON_E2E_TEST}$" -timeout=50m -count=1 -v ./test/...

  lima-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 2.0.0
            sha256: e20350addf8b2bfe96baf7fc1619ce69b0f5bfeafc1dac0a651daf3c1092c297
          - version: 2.2.0
            sha256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Lima ${{ matrix.version }}
        env:
          LIMA_VERSION: ${{ matrix.version }}
          LIMA_SHA256: ${{ matrix.sha256 }}
        run: |
          archive="lima-${LIMA_VERSION}-Linux-x86_64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -fsSL -o "${archive_path}" "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${archive}"
          printf '%s  %s\n' "${LIMA_SHA256}" "${archive_path}" | sha256sum -c -
          mkdir "${RUNNER_TEMP}/lima"
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}/lima"
          echo "${RUNNER_TEMP}/lima/bin" >> "${GITHUB_PATH}"

      - name: Test Lima compatibility contract
        env:
          WATERMELON_TEST_REAL_LIMA_INFO: "1"
          WATERMELON_EXPECT_LIMA_VERSION: ${{ matrix.version }}
        run: go test -count=1 ./internal/lima

  draft-release:
    needs:
      - test
      - real-vm-security
      - lima-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Prepare release notes
        run: sh ./test/release_notes.sh "${GITHUB_REF_NAME}" CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"

      - name: Build and create draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage and verify release assets
        run: |
          ./test/stage_release_assets.sh dist release-dist
          (cd release-dist && sha256sum --check checksums.txt)

      - name: Validate release build metadata
        run: sh ./test/release_buildinfo.sh release-dist "${GITHUB_REF_NAME}"

      - name: Pack release artifacts
        run: tar -czf release-assets.tar.gz -C release-dist .

      - name: Stage release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  installer-smoke:
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      - name: Smoke test release artifacts and installer
        run: |
          mkdir dist
          tar -xzf release-assets.tar.gz -C dist
          ./test/install_smoke.sh dist "${GITHUB_REF_NAME}"

  publish:
    needs: installer-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Validate and publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected_assets=$(printf '%s\n' \
            checksums.txt \
            watermelon-darwin-amd64 \
            watermelon-darwin-arm64 \
            watermelon-linux-amd64 \
            watermelon-linux-arm64 \
            watermelon-nfqd-linux-amd64 \
            watermelon-nfqd-linux-arm64 | sort)
          actual_assets=$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' | sort)
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "draft release assets do not match the expected set" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "$expected_assets" "$actual_assets" >&2
            exit 1
          fi

          is_draft=$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft \
            --jq '.isDraft')
          if [ "$is_draft" = "false" ]; then
            echo "release ${GITHUB_REF_NAME} is already published"
            exit 0
          fi
          if [ "$is_draft" != "true" ]; then
            echo "release ${GITHUB_REF_NAME} has an unexpected draft state: $is_draft" >&2
            exit 1
          fi

          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest

[vm]
image = "ubuntu-22.04"

[network]
allow = [
    "github.com",
    "raw.githubusercontent.com",
    "*.githubusercontent.com",
    "binaries.soliditylang.org",
]

[tools]
# Preload the image; foundry.sh selects the entrypoint explicitly.
"ghcr.io/foundry-rs/foundry:latest" = []

[ports]
forward = [8545]

[resources]
memory = "4GB"
cpus = 2
disk = "20GB"

[security]
enforcement = "fail"

[vm]
image = "ubuntu-22.04"

[network]
allow = [
    "pypi.org",
    "files.pythonhosted.org",
    "huggingface.co",
    "*.huggingface.co",
    "download.pytorch.org",
    "storage.googleapis.com",
]

[tools]
"python:3.12-bookworm" = ["python", "python3", "pip"]

[setup]
profile = "python"
runtime = "3.12"

[ports]
forward = [8888]

[resources]
memory = "8GB"
cpus = 4
disk = "30GB"

[security]
enforcement = "fail"

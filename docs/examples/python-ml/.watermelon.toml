[vm]
image = "ubuntu-22.04"

[network]
allow = [
    "pypi.org",
    "files.pythonhosted.org",
    "huggingface.co",
    "*.huggingface.co",
    "download.pytorch.org",
    "storage.googleapis.com",
]

[tools]
"python:3.12-slim" = ["python", "python3", "pip"]

[ports]
forward = [8888]

[resources]
memory = "32GB"
cpus = 8
disk = "100GB"

[security]
enforcement = "fail"
